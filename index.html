<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="TechFix.ico" type="image/x-icon">   <!-- Icone no topo da página -->
    <title>TechFix Informática</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  
    <header>
        <h1>TechFix Informática</h1>
        <p>Manutenção e suporte para seu computador &#x1F6E0</p>
    </header>

    <nav>
        <a href="#inicio">Início</a>
        <a href="#servicos">Serviços</a>
        <a href="#contato">Contato</a>

    </nav>
    <main>
        
        <section id="inicio">
            <h2>Manutenção e suporte para seu computador &#x1F6E0</h2>   
            <!-- Titulo com código de emoji de ferramenta -->

        </section>
        <section id="servicos">
            <div>
                <h2> Orçamento de Serviços</h2>
                <p>Nome do cliente:</p>
                <input type="text" placeholder="Digite seu nome ..." id="nome">

                <p>Escolha um serviços:</p>

                <select id="servico" >
                    <!-- Opções de serviços  -->
                    <option value="formatar">Formatação de computador	R$ 120,00</option>
                    <option value="limpar">Limpeza e manutenção	    R$ 80,00</option>
                    <option value="instalar">Instalação de programas	R$ 50,00</option>
                    <option value="salvar">Backup de arquivos	        R$ 100,00</option>
                    
                </select>
            </div>
            <!-- espaço para exibir orçamento -->

            <div>
                <button  onclick="orcamento()">Calcular Orçamento</button>

                <div class="orcamento"> 
                    <!-- Div escura que exibe os resultados nos parágrafos abaixo -->
                    <p id="saudar"></p>
                    <p id="serviconome"></p>
                    <p id="valorServico"></p>

                </div>
                    
            </div>

        </section>
        

        <section id="contato">
            <!-- isso tá usando umm id vindo do css com "#" -->
            <h2>Contato</h2>

            <p>E-mail: contato@TechFixInfo.com.br</p>

            <p>Telefone: (34)99999-9999</p>

        </section>

    </main>
    <footer>
        <p>TechFix Informática - 2026 &reg </p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
